services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      - DATA_DIR=/app/data
    volumes:
      - attic-data:/app/data

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HOST_PORT:-8080}:80"

volumes:
  attic-data:
