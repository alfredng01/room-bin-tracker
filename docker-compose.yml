services:
  backend:
    build: ${APP_PATH:-.}/backend
    restart: unless-stopped
    environment:
      - DATA_DIR=/app/data
    volumes:
      - ${DATA_PATH:-./data}:/app/data

  frontend:
    build: ${APP_PATH:-.}/frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HOST_PORT:-8080}:80"
