# Behind a Cloudflare tunnel, cloudflared connects to us over plain HTTP, so
# $scheme / $remote_addr describe cloudflared, not the visitor. Prefer the
# headers Cloudflare sets, and fall back to nginx's own values when the app
# is reached directly (e.g. http://unraid:8080).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $http_cf_connecting_ip $client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location / {
        try_files $uri /index.html;
    }
}
